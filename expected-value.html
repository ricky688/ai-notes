<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期望值與公平遊戲 (Expected Value)</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 20px; background: #f9f9f9; text-align: center; color: #333; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        .input-group { margin: 15px 0; display: flex; justify-content: space-between; align-items: center; }
        input[type="number"] { width: 80px; padding: 5px; text-align: center; border: 1px solid #ccc; border-radius: 4px; }
        input[type="range"] { width: 60%; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 8px; font-size: 24px; font-weight: bold; background: #eee; transition: background 0.3s; }
        .fair { background: #2ecc71; color: white; }
        .unfair-pos { background: #3498db; color: white; }
        .unfair-neg { background: #e74c3c; color: white; }
        .status-text { font-size: 16px; margin-top: 5px; font-weight: normal; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚖️ 期望值計算器</h2>
    
    <div class="input-group">
        <label>結果 A 的收益 (贏):</label>
        <input type="number" id="payoffA" value="100" oninput="calculate()">
    </div>
    
    <div class="input-group">
        <label>結果 B 的收益 (輸):</label>
        <input type="number" id="payoffB" value="-100" oninput="calculate()">
    </div>

    <div class="input-group" style="flex-direction: column; align-items: stretch;">
        <label style="text-align: left; margin-bottom: 5px;">
            結果 A 發生的機率: <span id="probLabel">50%</span>
        </label>
        <input type="range" id="probA" min="0" max="100" value="50" oninput="calculate()">
        <small style="text-align: left; color: #777;">(結果 B 的機率會自動設為 <span id="probBLabel">50%</span>)</small>
    </div>

    <div id="resultBox" class="result-box fair">
        期望值 (E) = <span id="expectedValue">0</span>
        <div id="statusText" class="status-text">這是一個公平遊戲 (Fair Game)！</div>
    </div>
</div>

<script>
    function calculate() {
        let pA = parseFloat(document.getElementById('probA').value) / 100;
        let pB = 1 - pA;
        let sA = parseFloat(document.getElementById('payoffA').value) || 0;
        let sB = parseFloat(document.getElementById('payoffB').value) || 0;

        document.getElementById('probLabel').innerText = (pA * 100).toFixed(0) + "%";
        document.getElementById('probBLabel').innerText = (pB * 100).toFixed(0) + "%";

        let expectedValue = (pA * sA) + (pB * sB);
        let evRounded = expectedValue.toFixed(2);
        
        let resultBox = document.getElementById('resultBox');
        let statusText = document.getElementById('statusText');
        document.getElementById('expectedValue').innerText = evRounded;

        resultBox.className = "result-box"; // Reset

        if (expectedValue === 0) {
            resultBox.classList.add("fair");
            statusText.innerText = "這是一個公平遊戲 (Fair Game)！";
        } else if (expectedValue > 0) {
            resultBox.classList.add("unfair-pos");
            statusText.innerText = "這對玩家有利 (長期下來會賺錢)";
        } else {
            resultBox.classList.add("unfair-neg");
            statusText.innerText = "這對玩家不利 (長期下來會賠錢)";
        }
    }
    calculate(); // Initial run
</script>

</body>
</html>
