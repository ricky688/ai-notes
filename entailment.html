<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wumpus World Entailment (蘊含) Visualization</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        .controls {
            margin-bottom: 20px;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: inline-block;
        }
        button {
            padding: 10px 15px;
            margin: 5px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            transition: 0.3s;
            font-weight: bold;
        }
        .btn-reset { background-color: #bdc3c7; color: #2c3e50; }
        .btn-kb { background-color: #e74c3c; color: white; }
        .btn-a1 { background-color: #3498db; color: white; }
        .btn-a2 { background-color: #f39c12; color: white; }
        button:hover { opacity: 0.8; }

        .models-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .model-card {
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border: 4px solid transparent;
            transition: all 0.3s ease;
        }
        /* Highlight Classes */
        .highlight-kb { border-color: #e74c3c; transform: scale(1.05); }
        .highlight-a1 { box-shadow: 0 0 15px 5px rgba(52, 152, 219, 0.6); }
        .highlight-a2 { box-shadow: 0 0 15px 5px rgba(243, 156, 18, 0.6); }

        .wumpus-grid {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 2px;
            background-color: #34495e;
            border: 2px solid #34495e;
        }
        .cell {
            background-color: #ecf0f1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            position: relative;
        }
        .cell-pit { background-color: #111; color: #fff; }
        .cell-safe { background-color: #2ecc71; color: #fff; }
        .cell-known { background-color: #bdc3c7; color: #2c3e50; }
        .coord {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 9px;
            color: #7f8c8d;
        }
        .cell-pit .coord { color: #ccc; }
        .icon { font-size: 20px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <h2>邏輯蘊含視覺化 (Logical Entailment in Wumpus World)</h2>
    <p>假設方格 [1,1] 安全且無微風，[2,1] 有微風。周圍 3 個未知方格共有 8 種可能的世界模型。</p>

    <div class="controls">
        <button class="btn-reset" onclick="resetHighlights()">顯示所有模型 (Reset)</button>
        <button class="btn-kb" onclick="highlight('kb')">標記知識庫模型 (KB Models)</button>
        <button class="btn-a1" onclick="highlight('a1')">標記 α1: [1,2] 是安全的 (Entailed)</button>
        <button class="btn-a2" onclick="highlight('a2')">標記 α2: [2,2] 是安全的 (Not Entailed)</button>
    </div>

    <div class="models-grid" id="models-container">
        </div>

    <script>
        const container = document.getElementById('models-container');
        
        // Generate the 8 possible states for [1,2], [2,2], [3,1]
        for (let i = 0; i < 8; i++) {
            // Binary conversion to get all combinations (0 = Safe, 1 = Pit)
            const p12 = (i & 4) ? 1 : 0;
            const p22 = (i & 2) ? 1 : 0;
            const p31 = (i & 1) ? 1 : 0;

            // Logic Rules (Knowledge Base)
            // If [1,1] has no breeze, [1,2] cannot have a pit.
            // If [2,1] has breeze, at least one adjacent square ([1,1], [2,2], [3,1]) must have a pit.
            // Since [1,1] is known safe, either [2,2] or [3,1] must have a pit.
            const isKB = (p12 === 0 && (p22 === 1 || p31 === 1));
            const isAlpha1 = (p12 === 0);
            const isAlpha2 = (p22 === 0);

            // Determine class and text for dynamic cells
            const c12 = p12 ? 'cell-pit' : 'cell-safe';
            const t12 = p12 ? '🕳️ PIT' : '✅ Safe';
            
            const c22 = p22 ? 'cell-pit' : 'cell-safe';
            const t22 = p22 ? '🕳️ PIT' : '✅ Safe';
            
            const c31 = p31 ? 'cell-pit' : 'cell-safe';
            const t31 = p31 ? '🕳️ PIT' : '✅ Safe';

            const card = document.createElement('div');
            card.className = `model-card ${isKB ? 'is-kb' : ''} ${isAlpha1 ? 'is-a1' : ''} ${isAlpha2 ? 'is-a2' : ''}`;
            card.innerHTML = `
                <div style="margin-bottom: 8px; font-weight: bold;">Model ${i + 1}</div>
                <div class="wumpus-grid">
                    <div class="cell ${c12}">${t12} <span class="coord">1,2</span></div>
                    <div class="cell ${c22}">${t22} <span class="coord">2,2</span></div>
                    <div class="cell" style="background:#ddd;">N/A <span class="coord">3,2</span></div>
                    
                    <div class="cell cell-known"><span class="icon">🧍</span>Agent<span class="coord">1,1</span></div>
                    <div class="cell cell-known"><span class="icon">🍃</span>Breeze<span class="coord">2,1</span></div>
                    <div class="cell ${c31}">${t31} <span class="coord">3,1</span></div>
                </div>
            `;
            container.appendChild(card);
        }

        function resetHighlights() {
            document.querySelectorAll('.model-card').forEach(card => {
                card.classList.remove('highlight-kb', 'highlight-a1', 'highlight-a2');
            });
        }

        function highlight(type) {
            resetHighlights();
            document.querySelectorAll(`.is-${type}`).forEach(card => {
                card.classList.add(`highlight-${type}`);
            });
        }
    </script>
</body>
</html>
